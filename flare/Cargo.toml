[package]
name = "flare"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flare-helios = { path = "../helios", features = ["runtime-package", "server"] }
libc = "0.2.189"
serde_json = "1.0"
sha2 = "0.10.9"

# DGX Spark and Grace hosts serve multi-host packages over RoCEnante, which links libibverbs.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
flare-helios = { path = "../helios", features = ["runtime-package", "server", "roce"] }
