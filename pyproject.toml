[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ignition"
version = "0.1.0"
description = "Python model preparation for the Helios CUDA graph serving core"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ignition = "ignition.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9,<10", "tiktoken>=0.12,<1"]
api-test = ["pytest>=9,<10", "openai>=2,<3", "anthropic>=0.70,<1"]
prepare = [
    "cryptography>=46,<52",
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
    "transformers[torch,vision,chat_template] @ git+https://github.com/huggingface/transformers.git@4cc2aa84301c9aa210b5513dab9fefae03981f6e",
    "flashinfer-python[b12x] @ git+https://github.com/local-inference-lab/flashinfer.git@73714d176fcc7d373320effb1766f1919483620c",
    "cuda-python==13.3.1",
    "safetensors==0.8.0",
    "tokenizers==0.23.2",
    "huggingface-hub==1.33.0",
    "accelerate==1.14.0",
    "Pillow==12.3.0",
    "flare-heliopause",
    "protobuf>=7.35.1,<8",
    "rich>=13",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
flare-heliopause = { path = "heliopause" }

[tool.setuptools.packages.find]
include = ["ignition*"]

[tool.setuptools.package-data]
"ignition.recipes.deepseek41" = ["assets/*"]
"ignition.recipes.deepseek4" = ["assets/*"]
"ignition.recipes.kimi3" = ["assets/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
