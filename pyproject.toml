[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ignition"
version = "0.1.0"
description = "Python model preparation for the Helios CUDA graph serving core"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ignition = "ignition.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9,<10"]
prepare = [
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
    "transformers[torch,vision,chat_template] @ git+https://github.com/huggingface/transformers.git@4cc2aa84301c9aa210b5513dab9fefae03981f6e",
    "flashinfer-python[b12x]",
    "cuda-python==13.3.1",
    "safetensors==0.8.0",
    "tokenizers==0.23.2",
    "huggingface-hub==1.33.0",
    "accelerate==1.14.0",
    "Pillow==12.3.0",
    "flare-heliopause",
    "protobuf>=7.35.1,<8",
    "rich>=13",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
flashinfer-python = { path = "../flashinfer", editable = true }
flare-heliopause = { path = "heliopause" }

[tool.ignition.source-revisions]
flashinfer = "0ed882a60e0188c76d8640ea244f0d1fd1c3b5ea"

[tool.setuptools.packages.find]
include = ["ignition*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
