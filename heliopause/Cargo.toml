[package]
name = "flare-heliopause"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "flare_heliopause"
crate-type = ["cdylib"]

[features]
default = ["server"]
server = ["helios-core/server"]
qualification = []
extension-module = ["pyo3/extension-module"]

[dependencies]
helios-core = { package = "flare-helios", path = "../helios", features = ["runtime-package"] }
pyo3 = { version = "0.28.3" }
libc = "0.2.189"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }
