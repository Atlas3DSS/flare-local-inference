[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "flare-heliopause"
version = "0.1.0"
requires-python = ">=3.12"
description = "Heliopause: CPython preparation hooks for Flare runtime packages"

[tool.maturin]
features = ["server", "extension-module"]
module-name = "flare_heliopause"
include = [{ path = "licenses/*", format = ["sdist", "wheel"] }]
