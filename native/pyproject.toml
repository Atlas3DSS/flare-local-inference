[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sparkgap-native"
version = "0.1.0"
requires-python = ">=3.12"
description = "Native CUDA graph replay for Sparkgap"

[tool.maturin]
features = ["server", "extension-module"]
module-name = "sparkgap_native"
include = [{ path = "licenses/*", format = ["sdist", "wheel"] }]
