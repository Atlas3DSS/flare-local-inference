name: Serving container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flare-container-main
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'local-inference-lab/flare' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, lil-flare-builder]
    timeout-minutes: 480
    env:
      DOCKER_HOST: unix:///run/lil-flashinfer-docker/docker.sock
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build, smoke-test, and publish
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/flare-docker.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT

          exec 9>/var/lib/github-flashinfer/locks/cu134-sm120-build.lock
          flock -w 21600 9

          image=ghcr.io/local-inference-lab/flare
          staging="$image:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata="$DOCKER_CONFIG/build.json"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --builder default \
            --platform linux/amd64,linux/arm64 --file Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$staging" --metadata-file "$metadata" \
            --progress plain --push .

          digest=$(jq -er '.["containerimage.digest"]' "$metadata")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="$image@$digest"
          docker buildx imagetools inspect "$reference" --raw | jq -e '
            (.manifests | type == "array") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' >/dev/null
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$reference"
            for command in version run agent fleet; do
              if [[ "$command" == version ]]; then
                args=(--version)
              else
                args=("$command" --help)
              fi
              docker run --rm --network none --pull never \
                --platform "linux/$arch" "$reference" "${args[@]}"
            done
          done

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            printf 'Main has advanced; keeping %s without promoting latest.\n' "$staging"
            exit 0
          fi
          docker buildx imagetools create --tag "$image:latest" "$reference"
          published=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
          [[ "$published" == "$digest" ]]
          printf 'Published %s:latest at %s\n' "$image" "$digest"
