name: Published changes

on:
  workflow_run:
    workflows: [Serving container]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      retry_nonce:
        description: Exact nonce of an uncertain delivery to reconcile and retry
        required: false
        type: string
      retry_head:
        description: Exact commit of that uncertain delivery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flare-published-changes
  cancel-in-progress: false
  queue: max

jobs:
  announce:
    if: >-
      github.repository == 'local-inference-lab/flare' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, Linux, X64, lil-flare-builder]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Test announcement boundaries
        run: python3 -m unittest discover -s tests/scripts -p 'test_announce_changes.py'
      - name: Summarize published commits when the interval permits
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.FLARE_DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.FLARE_DISCORD_CHANNEL_ID }}
          BOOTSTRAP_SHA: ${{ vars.FLARE_ANNOUNCE_BASE_SHA }}
          BOOTSTRAP_TIME: ${{ vars.FLARE_ANNOUNCE_BASE_TIME }}
          MODEL_URL: ${{ vars.FLARE_CHANGELOG_MODEL_URL }}
          MODEL_NAME: ${{ vars.FLARE_CHANGELOG_MODEL }}
          RETRY_NONCE: ${{ inputs.retry_nonce || '' }}
          RETRY_HEAD: ${{ inputs.retry_head || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --channel-id "$CHANNEL_ID"
            --state-dir /var/lib/github-flashinfer/state/flare-announcements
            --image ghcr.io/local-inference-lab/flare:latest
            --bootstrap-sha "$BOOTSTRAP_SHA"
            --bootstrap-time "$BOOTSTRAP_TIME"
            --model-url "$MODEL_URL"
            --model "$MODEL_NAME"
          )
          if [[ -n "$RETRY_NONCE" || -n "$RETRY_HEAD" ]]; then
            args+=(--retry-uncertain "$RETRY_NONCE" --retry-head "$RETRY_HEAD")
          fi
          python3 scripts/announce_changes.py "${args[@]}"
