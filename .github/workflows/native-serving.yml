name: Native serving

on:
  push:
    branches: [main, feature/windows-serving]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build nasm protobuf-compiler
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin --version 0.23.1
      - name: Cross-compile Windows serving
        run: cargo xwin build --locked --release --manifest-path flare/Cargo.toml --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: flare-windows-cross
          path: flare/target/x86_64-pc-windows-msvc/release/flare.exe

  native:
    needs: windows-cross
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm protobuf-compiler libssl-dev liburing-dev
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc nasm --yes --no-progress
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native serving
        id: build
        run: cargo build --locked --release --manifest-path flare/Cargo.toml
      - name: Test native runtime on Linux
        if: runner.os == 'Linux'
        run: |
          ulimit -l
          sudo prlimit --pid $$ --memlock=67108864:67108864
          cargo test --locked --release --manifest-path helios/Cargo.toml --target-dir flare/target --features runtime-package,server
      - name: Test native runtime on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked --release --manifest-path helios/Cargo.toml --target-dir flare/target --features runtime-package,server
      - name: Test native CLI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked --release --manifest-path flare/Cargo.toml
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: flare-windows-cross
          path: cross
      - name: Exercise native and cross-compiled executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($exe in @('.\flare\target\release\flare.exe', '.\cross\flare.exe')) {
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw "$exe --help failed" }
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw "$exe --version failed" }
            & $exe agent
            if ($LASTEXITCODE -eq 0) { throw "$exe accepted unsupported multi-host serving" }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: flare-windows-native
          path: flare/target/release/flare.exe
