[package]
name = "flare-helios"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.87"
publish = false

[lib]
name = "flare_helios"
crate-type = ["rlib"]

[features]
default = []
test-tools = []
runtime-package = ["dep:serde", "dep:serde_json", "dep:prost", "dep:prost-types", "dep:prost-build", "dep:ring"]
frontend = ["dep:serde", "dep:tokenizers", "dep:minijinja", "dep:minijinja-contrib", "dep:serde_json", "dep:sha2", "dep:ryu"]
images = ["frontend", "dep:png", "dep:turbojpeg"]
grammar = ["frontend", "dep:llguidance"]
server = ["dep:serde", "images", "grammar", "dep:axum", "dep:tokio", "dep:async-stream", "dep:base64", "dep:ratatui", "dep:crossterm", "dep:futures-util", "dep:flate2", "dep:zstd", "dep:brotli"]
# RoCEnante's RDMA proxy for ranks on separate hosts; links libibverbs.
roce = ["dep:cc", "runtime-package"]

[dependencies]
futures-util = { version = "0.3", optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
brotli = { version = "8", optional = true }
ring = { version = "0.17.14", optional = true }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
blake2 = "0.10"
libloading = "0.8.9"
libc = "0.2.189"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"], optional = true }
minijinja = { version = "2.24.0", features = ["loader", "preserve_order", "loop_controls"], optional = true }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"], optional = true }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"], optional = true }
sha2 = { version = "0.10.9", optional = true }
ryu = { version = "1.0", optional = true }
png = { version = "0.18.1", optional = true }
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"], optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros"], optional = true }
async-stream = { version = "0.3.6", optional = true }
base64 = { version = "0.22.1", optional = true }
llguidance = { version = "=1.9.1", default-features = false, features = ["lark", "referencing", "ahash", "jsonschema_validation"], optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.28", default-features = false, optional = true }
io-uring = "0.7"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }

[build-dependencies]
prost-build = { version = "0.14", optional = true }
cc = { version = "1.6", optional = true }

[[bin]]
name = "test_fixed_runtime_package"
path = "tests/tools/test_fixed_runtime_package.rs"
required-features = ["runtime-package", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_runtime_package"
path = "tests/tools/test_runtime_package.rs"
required-features = ["runtime-package", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_frontend"
path = "tests/tools/test_frontend.rs"
required-features = ["frontend", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_images"
path = "tests/tools/test_images.rs"
required-features = ["images", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_requests"
path = "tests/tools/test_requests.rs"
required-features = ["server", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_deepseek4_images"
path = "tests/tools/test_deepseek4_images.rs"
required-features = ["server", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_mimo_images"
path = "tests/tools/test_mimo_images.rs"
required-features = ["server", "test-tools"]
test = false
bench = false

[[bin]]
name = "test_package_protection"
path = "tests/tools/test_package_protection.rs"
required-features = ["runtime-package", "test-tools"]
test = false
bench = false
