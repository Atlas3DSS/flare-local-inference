syntax = "proto3";
package flare.runtime;
import "google/protobuf/struct.proto";

message ModelIndex {
  uint32 version = 1;
  repeated BundleIndex ranks = 2;
  repeated PeerMemory peer_memory = 3;
  google.protobuf.Struct server = 4;
  repeated Asset assets = 5;
}
message Asset { string name = 1; Span payload = 2; string sha256 = 3; }
message BundleIndex {
  repeated int32 architecture = 1;
  repeated Allocation allocations = 2;
  repeated Module modules = 3;
  repeated Function functions = 4;
  repeated GraphIndex graphs = 5;
  repeated Reservation reservations = 6;
  Execution execution = 7;
  Context context = 8;
  map<string, Span> resources = 9;
}
message GraphIndex {
  string name = 1;
  uint64 flags = 2;
  string resource = 3;
  uint64 node_count = 4;
  uint64 edge_count = 5;
  repeated uint64 functions = 6;
}


message PeerMemory {
  uint32 owner = 1;
  uint64 address = 2;
  uint64 nbytes = 3;
  repeated uint32 readers = 4;
}


message Context { uint32 flags = 1; int32 cache = 2; repeated Limit limits = 3; }
message Limit { uint64 id = 1; uint64 value = 2; }
message Reservation { uint64 address = 1; uint64 nbytes = 2; }
message Span { uint64 offset = 1; uint64 nbytes = 2; }
// PEER names another rank's device allocation that this rank reads or writes at its recorded
// address; the owner allocates it and model.pb grants this rank access.
enum Memory { DEVICE = 0; MAPPED_HOST = 1; PEER = 2; }
message Allocation {
  string name = 1;
  uint64 nbytes = 2;
  uint64 alignment = 3;
  optional string file = 4;
  repeated Span data_spans = 5;
  repeated Relocation relocations = 6;
  optional uint64 address = 7;
  Memory memory = 8;
  Sizing sizing = 9;
}
enum Capacity { STATE_ROWS = 0; KV_PAGES = 1; }
message Sizing { Capacity capacity = 1; uint64 unit_bytes = 2; uint64 maximum = 3; }
message Module { string name = 1; string file = 2; repeated Global globals = 3; }
message Global { string symbol = 1; string file = 2; uint64 nbytes = 3; repeated Relocation relocations = 4; }
message Function {
  string module = 1;
  string symbol = 2;
  repeated uint64 parameter_sizes = 3;
  repeated FunctionAttribute attributes = 4;
}
message FunctionAttribute { int32 id = 1; int32 value = 2; }
message Reference { string allocation = 1; uint64 offset = 2; }
enum RelocationKind { POINTER = 0; TENSOR_MAP = 1; }
message Relocation { uint64 offset = 1; Reference target = 2; RelocationKind kind = 3; }
message Blob { bytes data = 1; repeated Relocation relocations = 2; }
message Attribute { int32 id = 1; Blob value = 2; }
message Kernel {
  uint64 function = 1;
  repeated uint32 grid = 2;
  repeated uint32 block = 3;
  uint32 shared = 4;
  repeated Blob arguments = 5;
  repeated Attribute attributes = 6;
}
message Memset {
  Reference destination = 1;
  uint64 pitch = 2;
  uint32 value = 3;
  uint32 element_size = 4;
  uint64 width = 5;
  uint64 height = 6;
}
message Copy { Reference source = 1; Reference destination = 2; uint64 nbytes = 3; }
message Empty {}
message Node {
  oneof operation { Kernel kernel = 1; Memset memset = 2; Copy copy = 3; Empty empty = 4; }
}
message Edge { uint64 source = 1; uint64 destination = 2; bytes data = 3; }

message Execution {
  uint32 abi_version = 1;
  uint64 max_active = 2;
  uint64 input_frame_bytes = 3;
  repeated Buffer buffers = 4;
  repeated ExecutionGraph graphs = 5;
}
message Buffer {
  string name = 1;
  uint64 nbytes = 2;
  string dtype = 3;
  repeated uint64 shape = 4;
  repeated uint64 strides = 5;
  Reference reference = 6;
}
message ExecutionGraph {
  string name = 1;
  string kind = 2;
  string sampling_mode = 3;
  uint64 batch_capacity = 4;
  uint64 token_capacity = 5;
  repeated InputBinding input_bindings = 6;
  optional uint32 draft_tokens = 7;
  // Target positions evaluated, including the pending input token.
  optional uint32 verify_tokens = 8;
  DraftSource draft_source = 9;
}
enum DraftSource { NO_DRAFT = 0; MTP = 1; COPY_DRAFT = 2; }
message InputBinding { string buffer_name = 1; uint64 host_offset = 2; uint64 nbytes = 3; }
