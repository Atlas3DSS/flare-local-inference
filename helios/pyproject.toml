[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "flare-helios"
version = "0.1.0"
requires-python = ">=3.12"
description = "Helios: Flare's Rust serving core and CUDA graph runtime"

[tool.maturin]
features = ["server", "extension-module"]
module-name = "flare_helios"
include = [{ path = "licenses/*", format = ["sdist", "wheel"] }]
